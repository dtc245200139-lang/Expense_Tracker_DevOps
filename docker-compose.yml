# ==============================================================================
# DOCKER COMPOSE - GIAI ĐOẠN 3.2: NGINX REVERSE PROXY & HTTPS (PORT 80 & 443)
# ==============================================================================

services:
  # 1. Nginx Reverse Proxy (HTTPS Termination & HTTP Redirect)
  nginx:
    image: nginx:1.27-alpine
    container_name: expense_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend_net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2. Ứng dụng Web Node.js (Expense Tracker)
  # HARDENING: Cổng 3000 KHÔNG mở ra máy host nữa.
  # Chỉ Nginx truy cập qua mạng frontend_net nội bộ.
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: expense-app:latest
    container_name: expense_app
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-expense_user}
      DB_PASSWORD: ${DB_PASSWORD:-expense_pass_secure_123}
      DB_NAME: ${DB_NAME:-expense_tracker_db}
    # Không mở port ra máy host — Nginx proxy nội bộ qua frontend_net
    expose:
      - "3000"
    networks:
      - frontend_net
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Cơ sở dữ liệu PostgreSQL 16 Alpine
  postgres:
    image: postgres:16-alpine
    container_name: expense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-expense_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expense_pass_secure_123}
      POSTGRES_DB: ${DB_NAME:-expense_tracker_db}
    # HARDENING: Cổng 5432 không mở ra máy host.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-expense_user} -d ${DB_NAME:-expense_tracker_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Giao diện quản trị cơ sở dữ liệu pgAdmin 4
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: expense_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_pass_secure_123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - frontend_net
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy

# Cấu hình phân tách mạng (Network Isolation)
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

# Named volume lưu trữ dữ liệu PostgreSQL an toàn
volumes:
  postgres_data:
