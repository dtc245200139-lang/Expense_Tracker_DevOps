# ==============================================================================
# DOCKER COMPOSE - GIAI ĐOẠN 3.2: NGINX REVERSE PROXY & HTTPS (PORT 80 & 443)
# ==============================================================================

services:
  # 1. Nginx Reverse Proxy (HTTPS Termination & HTTP Redirect)
  nginx:
    image: nginx:1.27-alpine
    container_name: expense_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend_net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2. Ứng dụng Web Node.js (Expense Tracker)
  # HARDENING: Cổng 3000 KHÔNG mở ra máy host nữa.
  # Chỉ Nginx truy cập qua mạng frontend_net nội bộ.
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: expense-app:latest
    container_name: expense_app
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?DB_USER must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_NAME: ${DB_NAME:-expense_tracker_db}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
    # Không mở port ra máy host — Nginx proxy nội bộ qua frontend_net
    expose:
      - "3000"
    networks:
      - frontend_net
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Cơ sở dữ liệu PostgreSQL 16 Alpine
  postgres:
    image: postgres:16-alpine
    container_name: expense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-expense_tracker_db}
    # HARDENING: Cổng 5432 không mở ra máy host.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER must be set in .env} -d ${DB_NAME:-expense_tracker_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Giao diện quản trị cơ sở dữ liệu pgAdmin 4
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: expense_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    networks:
      - frontend_net
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy

  # 5. Hệ thống giám sát Prometheus
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: expense_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - frontend_net
    depends_on:
      app:
        condition: service_healthy

  # 6. Giao diện trực quan hóa Grafana
  grafana:
    image: grafana/grafana:11.2.0
    container_name: expense_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - frontend_net
    depends_on:
      - prometheus

  # 7. PostgreSQL Metrics Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: expense_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/${DB_NAME:-expense_tracker_db}?sslmode=disable"
      DATA_SOURCE_USER: ${DB_USER:?DB_USER must be set in .env}
      DATA_SOURCE_PASS: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    networks:
      - backend_net   # Để kết nối vào postgres:5432
      - frontend_net  # Để prometheus kết nối scrape tại cổng 9187
    depends_on:
      postgres:
        condition: service_healthy

  # 8. Container Advisor (cAdvisor) giám sát tài nguyên container
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: expense_cadvisor
    restart: unless-stopped
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=15s'
      - '--disable_metrics=disk,tcp,udp,percpu,sched'
    # HARDENING: Không publish cổng 8080 ra host, chỉ expose nội bộ cho Prometheus
    # Không bật privileged. Chỉ mount read-only các thành phần tối thiểu cần thiết
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
    networks:
      - frontend_net  # Để prometheus kết nối scrape tại cổng 8080

  # 9. Loki - Hệ thống thu thập và lưu trữ log
  loki:
    image: grafana/loki:3.5.1
    container_name: expense_loki
    restart: unless-stopped
    command:
      - '-config.file=/etc/loki/config.yml'
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - frontend_net

  # 10. Promtail - Thu thập log từ các container Docker
  promtail:
    image: grafana/promtail:3.5.0
    container_name: expense_promtail
    restart: unless-stopped
    command:
      - '-config.file=/etc/promtail/config.yml'
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    networks:
      - frontend_net
    depends_on:
      - loki

# Cấu hình phân tách mạng (Network Isolation)
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

# Named volume lưu trữ dữ liệu an toàn
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
