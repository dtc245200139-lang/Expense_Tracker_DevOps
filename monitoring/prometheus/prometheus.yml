global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Job tự giám sát Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Job thu thập metrics từ ứng dụng Node.js/Express
  - job_name: 'expense-app'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']

  # Job thu thập metrics từ PostgreSQL database thông qua postgres-exporter
  - job_name: 'postgres-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Job thu thập metrics tài nguyên container từ cAdvisor
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
