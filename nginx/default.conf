# ==============================================================================
# NGINX REVERSE PROXY - EXPENSE TRACKER (GIAI ĐOẠN 3.2: HTTPS & HTTP REDIRECT)
# ==============================================================================

# Khai báo địa chỉ upstream (service 'app' trong Docker network)
# 1. Cấu hình HTTP (Port 80): Chuyển hướng toàn bộ traffic sang HTTPS (Port 443)
#    Ngoại trừ endpoint /nginx-health phục vụ healthcheck của Docker
server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Endpoint kiểm tra sức khỏe Nginx qua HTTP
    location /nginx-health {
        access_log off;
        return 200 "nginx OK\n";
        add_header Content-Type text/plain;
    }

    # Chuyển hướng 301 vĩnh viễn mọi request khác sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Cấu hình HTTPS (Port 443): SSL/TLS termination & Reverse proxy tới Node.js
server {
    listen 443 ssl;
    server_name localhost 127.0.0.1;

    # Resolve Docker service IP changes after the app container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $expense_app_host app;

    # Đường dẫn chứng chỉ và khóa riêng tư (mount từ ./nginx/certs)
    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # Cấu hình giao thức và mã hóa an toàn (TLS 1.2 & TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Giới hạn kích thước body request
    client_max_body_size 10M;

    # Security Headers tiêu chuẩn
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS is intentionally omitted for the localhost self-signed certificate.

    # Chuyển tiếp toàn bộ request đến ứng dụng Node.js
    location / {
        proxy_pass http://$expense_app_host:3000;

        # Các header nhận diện client thực và giao thức HTTPS
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout hợp lý cho ứng dụng web
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Endpoint kiểm tra sức khỏe Nginx qua HTTPS
    location /nginx-health {
        access_log off;
        return 200 "nginx HTTPS OK\n";
        add_header Content-Type text/plain;
    }
}
